name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install "detect-secrets>=1.5,<2"
      - name: Escanear secretos
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)(\.git|__pycache__|\.venv|venv|node_modules)/' > /tmp/detect-secrets.json
          python -c "import json; data=json.load(open('/tmp/detect-secrets.json')); assert not data['results'], data['results']"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q tools integratevibes composio-telegram-miniapp automation
      - run: node --check composio-telegram-miniapp/app.js
